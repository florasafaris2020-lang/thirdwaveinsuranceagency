name: sync applicant form mirror
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble mirror from production
        run: |
          curl -fsSL https://third-wave-insurance-applications-6hj0lm.freebuff.site/ -o /tmp/prod.html
          sed 's|<body data-api-base="">|<body data-api-base="https://third-wave-insurance-applications-6hj0lm.freebuff.site">|' /tmp/prod.html > index.html
          grep -q 'data-api-base="https://third-wave-insurance-applications-6hj0lm.freebuff.site"' index.html
          grep -q 'motorVehicleBodyTypes' index.html
          ACTUAL=$(sha256sum index.html | cut -d' ' -f1)
          echo "mirror sha256: $ACTUAL"
          test "$ACTUAL" = "907bdf0aad4278e31ec1524a6a49ecbe71a2852f6361aeeed53be67331990061"
      - name: Commit mirror
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'chore: sync applicant form with body type select for Type A, B and C'
          git push
