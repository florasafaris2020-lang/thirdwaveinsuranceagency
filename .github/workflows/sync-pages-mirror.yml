name: sync-pages-mirror

on:
  push:
    paths:
      - '.github/workflows/sync-pages-mirror.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull production assets
        run: |
          BASE="https://third-wave-insurance-applications-6hj0lm.freebuff.site"
          fetch () {
            url="$1"; out="$2"
            for attempt in 1 2 3 4 5; do
              code=$(curl -sSL -A 'Mozilla/5.0' -H 'Cache-Control: no-cache' -o "$out" -w '%{http_code}' "$url" || true)
              echo "$url attempt $attempt -> HTTP $code"
              if [ "$code" = "200" ]; then return 0; fi
              sleep 8
            done
            return 1
          }
          fetch "$BASE/" index.html
          fetch "$BASE/header-bg.jpg" header-bg.jpg
          fetch "$BASE/header-bg-mobile.jpg" header-bg-mobile.jpg
          grep -q 'data-api-base="https://third-wave-insurance-applications-6hj0lm.freebuff.site"' index.html || sed -i 's|<body data-api-base="">|<body data-api-base="https://third-wave-insurance-applications-6hj0lm.freebuff.site">|' index.html
      - name: Commit and remove this workflow
        run: |
          set -e
          git config user.name "pages-sync"
          git config user.email "actions@users.noreply.github.com"
          git rm --quiet .github/workflows/sync-pages-mirror.yml
          git add index.html header-bg.jpg header-bg-mobile.jpg
          git commit -m "chore: sync Pages mirror with light-blue header tint"
          git push
