name: Sync Pages Mirror
on: workflow_dispatch
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mirror production form
        run: |
          set -euo pipefail
          curl -fsSL https://third-wave-insurance-applications-6hj0lm.freebuff.site/ -o /tmp/prod.html
          sed 's|<body data-api-base="">|<body data-api-base="https://third-wave-insurance-applications-6hj0lm.freebuff.site">|' /tmp/prod.html > index.html
          test "$(sha256sum index.html | cut -d' ' -f1)" = "e70a3762ae498d3e827e8d8ac9e122ea235b5cc51f85b379e2a6e327fb10c80d"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Sync Pages mirror with production form"
          git push
