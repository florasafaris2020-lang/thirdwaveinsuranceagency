name: sync-body-type-simplified
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Pages copy from production form
        run: |
          curl -fsS https://third-wave-insurance-applications-6hj0lm.freebuff.site/ -o /tmp/production-form.html
          sed 's|<body data-api-base="">|<body data-api-base="https://third-wave-insurance-applications-6hj0lm.freebuff.site">|' /tmp/production-form.html > index.html
          echo "426fa63198bd45dc4a8a542cfde862fe20f62ff2f0a3e86dc8fcf0af08df1024  index.html" | sha256sum -c -
      - name: Commit if changed
        run: |
          if git diff --quiet -- index.html; then echo "already in sync"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: simplify body type control on the applicant form"
          git push
