name: sync-photo-field
on: workflow_dispatch
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('index.html')
          html = p.read_text()
          anchor = '</fieldset>\n\n<div id="formStatus"'
          assert html.count(anchor) == 1, html.count(anchor)
          addition = '</fieldset>\n\n<div class="form-group"><label for="vehicleFrontPhoto">Front picture of vehicle</label><input type="file" id="vehicleFrontPhoto" name="vehicle_front_photo" accept=".pdf,.jpg,.jpeg,.png"><div class="field-error" data-for="vehicle_front_photo"></div><small class="help-text">Optional \u2014 a clear photo of the front of the vehicle. PDF, JPG, or PNG, up to 5 MB.</small></div>\n\n<div id="formStatus"'
          p.write_text(html.replace(anchor, addition))
          actual = hashlib.sha256(p.read_bytes()).hexdigest()
          expected = '69d881956a5d18cae4ce57ae8c995e0c08e44a880f1bd2bdc9d0c7302e71f6e5'
          assert actual == expected, actual
          print('sha256', actual)
          PY
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add optional front picture of vehicle upload to the Pages form'
          git push
