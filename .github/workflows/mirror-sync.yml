name: mirror-sync
on:
  push:
    branches: [mirror-sync]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy the live form into index.html
        run: |
          set -e
          curl -fsSL "https://third-wave-insurance-applications-6hj0lm.freebuff.site/" -o index.html
          sed -i 's|<body data-api-base="">|<body data-api-base="https://third-wave-insurance-applications-6hj0lm.freebuff.site">|' index.html
          wc -c index.html
          sha256sum index.html
          git config user.name "mirror-sync"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "mirror: sync form from production"
          git push
