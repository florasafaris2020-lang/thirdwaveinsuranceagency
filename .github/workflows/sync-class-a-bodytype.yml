name: sync-class-a-bodytype
on: workflow_dispatch
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch production page and build mirror
        run: |
          set -euo pipefail
          curl -fsSL "https://third-wave-insurance-applications-6hj0lm.freebuff.site/" -o /tmp/prod.html
          test "$(grep -Fc "Class A - PSV Unmarked','Type A" /tmp/prod.html)" = "1"
          sed 's|<body data-api-base="">|<body data-api-base="https://third-wave-insurance-applications-6hj0lm.freebuff.site">|' /tmp/prod.html > /tmp/index.html
          actual=$(sha256sum /tmp/index.html | cut -d' ' -f1)
          echo "mirror sha256=$actual"
          test "$actual" = "8b201e269909b75fb2acd4232c7f40dbeea30c594869bb9e1ee5043ea518ab89"
          cp /tmp/index.html index.html
      - name: Commit mirror
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "chore: mirror Class A vehicle body type dropdown"
          git push
