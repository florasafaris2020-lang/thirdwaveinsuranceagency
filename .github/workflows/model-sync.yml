name: model-sync
on: workflow_dispatch
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch mirror
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY" 2>&1
          import io, hashlib
          p = 'index.html'
          s = io.open(p, encoding='utf-8').read()
          a1 = "makeSelect.addEventListener('change',updateMakeOther);updateMakeOther();"
          b1 = "makeSelect.addEventListener('change',()=>{updateMakeOther();fillModelOptions()});updateMakeOther();"
          a2 = "modelSelect.addEventListener('change',updateModelOther);updateModelOther();"
          b2 = "modelSelect.addEventListener('change',updateModelOther);\nconst modelGroups=new Map();modelSelect.querySelectorAll('optgroup').forEach(group=>modelGroups.set(group.label,[...group.children].map(option=>option.textContent)));\nfunction fillModelOptions(){const make=makeSelect.value,models=modelGroups.get(make)||[];modelSelect.replaceChildren(new Option(make?'-- Select vehicle model --':'-- Select vehicle make first --',''));modelSelect.disabled=!make;if(make){const group=document.createElement('optgroup');group.label=make;models.forEach(model=>group.appendChild(new Option(model,model)));group.appendChild(new Option('Other (not listed)','Other'));modelSelect.add(group);if(!models.length)modelSelect.value='Other'}updateModelOther()}\nfillModelOptions();"
          a3 = "form.reset();updateMakeOther();updateModelOther();"
          b3 = "form.reset();updateMakeOther();fillModelOptions();"
          for a, b in ((a1, b1), (a2, b2), (a3, b3)):
              print('anchor count', s.count(a))
              assert s.count(a) == 1
              s = s.replace(a, b)
          io.open(p, 'w', encoding='utf-8').write(s)
          h = hashlib.sha256(s.encode('utf-8')).hexdigest()
          print('sha256', h)
          assert h == '60a4450dbdf8375124e547a26e8015831970feff028c8857760ae385fcea76fd', h
          print('bytes', len(s.encode('utf-8')))
          PY
      - name: Commit
        run: |
          set -e
          git config user.name "mirror-bot"
          git config user.email "mirror-bot@users.noreply.github.com"
          git add index.html
          git commit -m "sync: pages mirror from production" || echo "nothing to commit"
          git push -f origin HEAD:refs/heads/model-filter-sync
