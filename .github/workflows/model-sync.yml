name: model-sync
on: workflow_dispatch
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build mirror
        run: |
          set -e
          curl -fsSL https://third-wave-insurance-applications-6hj0lm.freebuff.site -o github-pages/index.html
          sed -i 's|<body data-api-base="">|<body data-api-base="https://third-wave-insurance-applications-6hj0lm.freebuff.site">|' github-pages/index.html
          sha256sum github-pages/index.html
          wc -c github-pages/index.html
      - name: Commit
        run: |
          set -e
          git config user.name "mirror-bot"
          git config user.email "mirror-bot@users.noreply.github.com"
          git add github-pages/index.html
          git commit -m "sync: pages mirror from production" || echo "nothing to commit"
          git push -f origin HEAD:refs/heads/model-filter-sync
